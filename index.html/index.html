<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>مدرسة الأشباح — ليلة العيد</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'Cairo','Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif;
  color:#e8eef7;touch-action:none;user-select:none;-webkit-user-select:none;position:fixed;inset:0;overscroll-behavior:none}
/* ====== إطار 16:9 صارم على كل الأجهزة (أعمدة سوداء تلقائية) ====== */
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:100%;height:100%;max-width:177.78vh;max-height:56.25vw;
  background:#05070d;overflow:hidden}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.overlay{position:absolute;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.22) 88%,rgba(0,0,0,.42) 100%);mix-blend-mode:multiply}
#grain{opacity:.025;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='.6'/></svg>");animation:gr .55s steps(3) infinite}
@keyframes gr{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}
#dmg{background:radial-gradient(ellipse at center,rgba(150,90,0,0) 40%,rgba(220,150,40,.5) 100%);opacity:0;transition:opacity .25s}
#fear{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(40,70,120,.22) 100%);opacity:0}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(ellipse at 50% 30%,#1b2c47 0%,#0d1524 60%,#070b12 100%);z-index:40}
.hidden{display:none!important}
#loading .lwrap{width:min(520px,86%);text-align:center}
#loading .ghost{font-size:58px;filter:drop-shadow(0 0 16px #7fd0ff);animation:fl 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-10px);opacity:1}}
#loading h1{font-size:clamp(20px,4.6vw,32px);margin:6px 0 2px;color:#dcecff}
#loading p{font-size:12.5px;color:#93a7c0;margin-bottom:14px}
.bar{width:100%;height:11px;background:#0b1220;border:1px solid #22364f;border-radius:8px;overflow:hidden}
.bar>div{height:100%;width:0%;background:linear-gradient(90deg,#2b7fff,#6fd3ff);transition:width .1s}
#loadTxt{margin-top:9px;font-size:11.5px;color:#7d92ac}
#menu{background-size:cover;background-position:center;padding:12px;overflow:auto;-webkit-overflow-scrolling:touch}
#menu .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,8,14,.72),rgba(4,8,14,.88))}
.mwrap{position:relative;width:min(760px,96%);max-height:100%;overflow:auto;padding:8px 4px 18px;text-align:center;-webkit-overflow-scrolling:touch}
.title{font-size:clamp(24px,5.6vw,44px);font-weight:700;color:#fff;text-shadow:0 0 22px rgba(90,170,255,.45),0 3px 0 #123}
.subtitle{font-size:clamp(11.5px,2.4vw,15px);color:#a8bdd6;margin:2px 0 12px}
.bigbtn{display:block;width:min(400px,92%);margin:8px auto;padding:16px 20px;font-size:21px;font-weight:700;font-family:inherit;
  border-radius:16px;border:1px solid #2f6fb8;color:#fff;cursor:pointer;min-height:58px;
  background:linear-gradient(180deg,#3d86d8,#1c4f8c);box-shadow:0 10px 26px rgba(30,90,180,.4),inset 0 1px 0 rgba(255,255,255,.22)}
.bigbtn.green{background:linear-gradient(180deg,#2f9e5f,#17663a);border-color:#3fc47a;box-shadow:0 10px 26px rgba(30,150,90,.35)}
.bigbtn.grey{background:linear-gradient(180deg,#3a4a60,#1d2635);border-color:#54708f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(520px,92%);margin:0 auto}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
/* ====== قائمة مبسّطة: إعدادات قابلة للطي ====== */
details.acc{background:rgba(9,15,26,.82);border:1px solid #20344d;border-radius:14px;margin:0 auto 10px;width:min(680px,96%);text-align:start;overflow:hidden}
details.acc>summary{list-style:none;cursor:pointer;padding:13px 15px;font-size:14.5px;font-weight:700;color:#9fd0ff;display:flex;align-items:center;gap:9px;min-height:48px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:after{content:'▾';margin-inline-start:auto;color:#6f92b5;transition:transform .2s}
details.acc[open]>summary:after{transform:rotate(180deg)}
.accBody{padding:2px 15px 13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #17293d;flex-wrap:wrap}
.row:last-child{border-bottom:none}
.row label{font-size:12.5px;color:#c9d9ec;min-width:104px}
.row .hint{font-size:10.5px;color:#7f92a9;width:100%;margin-top:2px;line-height:1.6}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{background:#0e1a2b;border:1px solid #26405e;color:#a9c0d8;padding:9px 12px;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit;min-height:40px}
.seg button.act{background:linear-gradient(180deg,#2f6fc4,#1b4a8a);border-color:#63a9ff;color:#fff}
.langs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:0 auto 10px}
.langs button{background:#0d1626;border:1px solid #24384f;color:#b8cbe2;padding:8px 12px;border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;min-height:38px}
.langs button.act{background:#1d3f6e;border-color:#4b8fe0;color:#fff}
input[type=range]{width:150px;accent-color:#3d8bff;height:32px}
.tips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.tip{background:#0c1524;border:1px solid #1e3049;border-radius:10px;padding:7px 11px;font-size:11px;color:#a7bcd4;line-height:1.7}
.tip b{color:#ffd479}
#buildStat{font-size:11.5px;color:#7fe0a8;margin-top:5px;min-height:17px}
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;font-size:12.5px}
.hpanel{position:absolute;background:linear-gradient(180deg,rgba(6,12,22,.68),rgba(6,12,22,.46));
  border:1px solid rgba(90,150,210,.35);border-radius:11px;padding:7px 11px}
#hudTL{top:calc(9px + env(safe-area-inset-top));inset-inline-start:calc(9px + env(safe-area-inset-left));min-width:168px}
#hudTR{top:calc(9px + env(safe-area-inset-top));inset-inline-end:calc(9px + env(safe-area-inset-right));text-align:end;min-width:160px}
#hudTC{top:calc(9px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.meter{height:8px;background:#0a1220;border:1px solid #22384f;border-radius:6px;overflow:hidden;margin:3px 0 5px}
.meter>div{height:100%;width:100%;transition:width .15s}
#hpFill{background:linear-gradient(90deg,#ffb03b,#ffe08a)}
#stFill{background:linear-gradient(90deg,#2bd67b,#a8ff6b)}
.kv{display:flex;justify-content:space-between;gap:9px;font-size:11.5px;color:#c2d4e8;line-height:1.5}
.kv b{color:#fff}
#areaName{font-size:13px;font-weight:700;color:#ffe6a8}
#seasonTag{font-size:10.5px;color:#9fe0ff}
#distLine{font-size:11px;color:#a9bed5;margin-top:2px}
#cross{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;opacity:.8}
#cross:before,#cross:after{content:'';position:absolute;background:rgba(255,255,255,.85)}
#cross:before{left:50%;top:0;width:2px;height:100%;margin-left:-1px}
#cross:after{top:50%;left:0;height:2px;width:100%;margin-top:-1px}
#prompt{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(5,10,18,.85);
  border:1px solid #3f7fbf;border-radius:11px;padding:9px 16px;font-size:14px;color:#fff;display:none;white-space:nowrap}
#prompt .key{display:inline-block;background:#1c4c86;border-radius:7px;padding:2px 10px;margin-inline-end:9px;font-weight:700}
#toast{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);background:rgba(8,16,28,.9);border:1px solid #4b8fe0;
  border-radius:11px;padding:9px 18px;font-size:13.5px;color:#dff0ff;display:none;max-width:86%;text-align:center}
#objHint{position:absolute;top:88px;left:50%;transform:translateX(-50%);background:rgba(10,26,18,.85);border:1px solid #4fc48a;
  border-radius:10px;padding:6px 14px;font-size:12px;color:#c8ffe0;display:none;text-align:center;max-width:88%}
#compass{position:absolute;left:50%;top:54%;width:50px;height:50px;margin:-25px 0 0 -25px;display:none}
#compass div{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;color:#ffd166;font-size:22px}
#touch{position:absolute;inset:0;z-index:25;display:none;pointer-events:none}
#lookZone{position:absolute;top:0;bottom:0;right:0;width:58%;pointer-events:auto;touch-action:none}
html[dir=rtl] #lookZone{right:auto;left:0}
#stick{position:absolute;width:142px;height:142px;border-radius:50%;display:none;pointer-events:auto;
  background:radial-gradient(circle,rgba(255,255,255,.10),rgba(255,255,255,.03));border:2px solid rgba(180,220,255,.32)}
#stickRing{position:absolute;inset:23px;border-radius:50%;border:1px dashed rgba(180,220,255,.2)}
#stickN{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(220,240,255,.55),rgba(120,180,255,.3));border:2px solid rgba(255,255,255,.5)}
#stickHint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:10.5px;color:rgba(220,240,255,.75);pointer-events:none}
.tbtn{position:absolute;width:66px;height:66px;border-radius:50%;background:rgba(10,20,35,.55);
  border:2px solid rgba(130,190,255,.45);color:#e6f2ff;font-size:12.5px;font-weight:700;font-family:inherit;
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;pointer-events:auto;touch-action:none}
.tbtn.act{background:rgba(60,130,215,.72);transform:scale(.94)}
#tE{inset-inline-end:calc(18px + env(safe-area-inset-right));bottom:calc(112px + env(safe-area-inset-bottom));width:78px;height:78px;font-size:14px}
#tC{inset-inline-end:calc(104px + env(safe-area-inset-right));bottom:calc(52px + env(safe-area-inset-bottom))}
#tJ{inset-inline-end:calc(22px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:82px;height:82px;font-size:15px}
#tR{inset-inline-end:calc(112px + env(safe-area-inset-right));bottom:calc(140px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:11.5px}
#tF{inset-inline-end:calc(184px + env(safe-area-inset-right));bottom:calc(90px + env(safe-area-inset-bottom));width:56px;height:56px;font-size:11.5px}
#tP{top:calc(9px + env(safe-area-inset-top));inset-inline-end:calc(9px + env(safe-area-inset-right));width:44px;height:44px;font-size:17px;
  position:absolute;z-index:30;background:rgba(10,20,35,.6);border:1px solid rgba(130,190,255,.4);border-radius:11px;
  color:#e6f2ff;display:none;align-items:center;justify-content:center;pointer-events:auto}
#touchHelp{position:absolute;left:50%;bottom:calc(9px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(6,12,22,.72);border:1px solid rgba(90,150,210,.32);border-radius:11px;padding:7px 13px;
  font-size:11px;color:#c8dcf0;display:none;pointer-events:none;text-align:center;max-width:92%;transition:opacity .5s}
.modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:rgba(3,6,12,.9);padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.mbox{width:min(520px,94%);text-align:center;background:linear-gradient(180deg,rgba(13,21,36,.96),rgba(7,11,19,.96));
  border:1px solid #26405e;border-radius:18px;padding:20px 16px}
.mbox h2{font-size:clamp(22px,5vw,34px);margin-bottom:6px;color:#ffd479}
.mbox p{color:#a9bfd8;font-size:13.5px;margin-bottom:13px;line-height:1.7}
.stars{display:flex;gap:6px;justify-content:center;font-size:12.5px;color:#ffd166;margin-bottom:9px;flex-wrap:wrap}
#adOver{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;color:#9fb6d1;font-size:14px}
.spinner{width:32px;height:32px;border:3px solid #22384f;border-top-color:#5aa9ff;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:13px}
@keyframes sp{to{transform:rotate(360deg)}}
#credit{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:10px;color:#4e6076;z-index:41}
#fatal{position:absolute;inset:0;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:#080c14;color:#ffd0d0;font-size:13.5px;text-align:center;padding:22px;line-height:1.9}
#fatal button{margin-top:15px;padding:11px 24px;border-radius:12px;border:1px solid #4d95e6;background:#1b4a8a;color:#fff;font-family:inherit;font-size:14px;cursor:pointer}
@media (max-height:520px){
  .hpanel{padding:4px 8px;font-size:10.5px;border-radius:9px}
  .kv{font-size:10px;line-height:1.3}
  .meter{height:5px;margin:2px 0 3px}
  #hudTC{display:none}
  .tbtn{width:54px;height:54px;font-size:10.5px}
  #tE{width:62px;height:62px;bottom:calc(88px + env(safe-area-inset-bottom))}
  #tJ{width:66px;height:66px}
  #tR,#tF{width:48px;height:48px}
  #stick{width:118px;height:118px}
  #stickN{width:50px;height:50px;margin:-25px 0 0 -25px}
}
@media (max-width:480px){
  #hudTL{min-width:142px}#hudTR{min-width:138px}
  .row label{min-width:100%;font-size:12px}
  input[type=range]{width:100%}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div class="overlay" id="fear"></div>
  <div class="overlay" id="dmg"></div>
  <div class="overlay" id="grain"></div>
  <div class="overlay" id="vig"></div>

  <div id="hud" class="hidden">
    <div id="cross"></div>
    <div class="hpanel" id="hudTL">
      <div class="kv"><span>⭐ <span data-i18n="lblHp"></span></span><b id="hpTxt">100</b></div>
      <div class="meter"><div id="hpFill"></div></div>
      <div class="kv"><span>⚡ <span data-i18n="lblSt"></span></span><b id="stTxt">100</b></div>
      <div class="meter"><div id="stFill"></div></div>
      <div class="kv"><span>🔦 <span data-i18n="lblBat"></span></span><b id="batTxt">100%</b></div>
      <div class="kv"><span>🔵 <span data-i18n="lblCells"></span></span><b id="cellsTxt">2</b></div>
      <div class="kv"><span>💰 <span data-i18n="lblCoins"></span></span><b id="coinsTxt">0</b></div>
    </div>
    <div class="hpanel" id="hudTR">
      <div class="kv"><span>🚰 <span data-i18n="lblFau"></span></span><b id="fauTxt">0 / 6</b></div>
      <div class="kv"><span>⏱️</span><b id="timeTxt">00:00</b></div>
      <div class="kv"><span>🧭 <span data-i18n="lblGhost"></span></span><b id="chaseTxt">—</b></div>
      <div class="kv"><span id="stateIco">🏃</span><b id="stateTxt">—</b></div>
    </div>
    <div class="hpanel" id="hudTC">
      <div id="areaName">—</div>
      <div id="seasonTag">—</div>
      <div id="distLine">🧭 ? m | 🐑 ? m</div>
    </div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="objHint"></div>
    <div id="compass"><div>▲</div></div>
  </div>

  <button id="tP">II</button>

  <div id="touch">
    <div id="lookZone"></div>
    <div id="stick"><div id="stickRing"></div><div id="stickN"></div><div id="stickHint"></div></div>
    <button class="tbtn" id="tE">E</button>
    <button class="tbtn" id="tC">C</button>
    <button class="tbtn" id="tJ">⤴</button>
    <button class="tbtn" id="tR">🏃</button>
    <button class="tbtn" id="tF">🔦</button>
    <div id="touchHelp"></div>
  </div>

  <div class="screen" id="loading">
    <div class="lwrap">
      <div class="ghost">🏫</div>
      <h1 id="ldTitle">مدرسة الأشباح</h1>
      <p id="ldSub">ليلة العيد — ٢٦ قاعة… وستة صنابير مفقودة</p>
      <div class="bar"><div id="loadBar"></div></div>
      <div id="loadTxt">0%</div>
    </div>
  </div>

  <!-- ====== قائمة مبسّطة: زر لعب كبير + إعدادات مطوية ====== -->
  <div class="screen hidden" id="menu">
    <div class="shade"></div>
    <div class="mwrap">
      <div class="title">🏫 مدرسة الأشباح 🐑</div>
      <div class="subtitle" data-i18n="subtitle"></div>

      <button class="bigbtn green" id="btnPlay" data-i18n="play"></button>
      <div id="buildStat"></div>

      <details class="acc" id="accMain">
        <summary>⚙️ <span data-i18n="settings"></span></summary>
        <div class="accBody">
          <div class="row"><label data-i18n="season"></label><div class="seg" id="segSeason"></div><div class="hint" id="seasonHint"></div></div>
          <div class="row"><label data-i18n="difficulty"></label><div class="seg" id="segDiff"></div></div>
          <div class="row"><label data-i18n="graphics"></label><div class="seg" id="segQual"></div></div>
          <div class="row"><label data-i18n="volume"></label><input type="range" id="rngVol" min="0" max="100" value="80"><b id="volVal">80%</b></div>
          <div class="row"><label data-i18n="lang2"></label><div class="langs" id="langs"></div></div>
        </div>
      </details>

      <details class="acc">
        <summary>🛠️ <span data-i18n="advanced"></span></summary>
        <div class="accBody">
          <div class="row"><label data-i18n="ambient"></label><div class="seg" id="segAmb"></div></div>
          <div class="row"><label data-i18n="tracking"></label><div class="seg" id="segTrack"></div><div class="hint" id="trackHint"></div></div>
          <div class="row"><label data-i18n="camera"></label><div class="seg" id="segCam"></div><div class="hint" data-i18n="camHint"></div></div>
          <div class="row"><label data-i18n="brightness"></label><input type="range" id="rngBri" min="70" max="160" value="100"><b id="briVal">100%</b></div>
          <div class="row"><label data-i18n="sensitivity"></label><input type="range" id="rngSens" min="20" max="260" value="110"><b id="sensVal">1.10</b></div>
        </div>
      </details>

      <details class="acc">
        <summary>🎮 <span data-i18n="howto"></span></summary>
        <div class="accBody">
          <div class="tips" id="tipsBox"></div>
          <div class="tips"><div class="tip" data-i18n="goalTip"></div></div>
          <div class="tips"><div class="tip" id="musicTip"></div></div>
        </div>
      </details>
    </div>
    <div id="credit">محلي بالكامل — لا روابط خارجية — three.local.js + موسيقى محلية لكل وضع</div>
  </div>

  <div class="modal hidden" id="pause">
    <div class="mbox">
      <h2 data-i18n="paused"></h2>
      <p id="pauseStats"></p>
      <button class="bigbtn" id="btnResume" data-i18n="resume"></button>
      <div class="grid2">
        <button class="bigbtn green" id="btnReward" style="font-size:15px">🎬 <span data-i18n="rewardBtn"></span></button>
        <button class="bigbtn grey" id="btnMenu" style="font-size:15px" data-i18n="mainMenu"></button>
      </div>
      <div class="stars"><span data-i18n="rewardNote"></span></div>
    </div>
  </div>

  <div class="modal hidden" id="endScreen">
    <div class="mbox">
      <h2 id="goTitle">—</h2>
      <p id="endMsg"></p>
      <div class="stars" id="endStats"></div>
      <button class="bigbtn" id="btnEndMenu" data-i18n="mainMenu"></button>
    </div>
  </div>

  <div id="adOver"><div class="spinner"></div><div id="adTxt">…</div></div>
  <div id="fatal"></div>
</div>

<!-- الرابط الخارجي الوحيد: Poki SDK -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<!-- المحرك: محلي -->
<script src="three.local.js"></script>

<script>
"use strict";
window.__GAME__=(function(){

/* ================= 0. UTIL ================= */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}

var Mus={
  el:null,key:null,target:0,cur:0,vol:0.5,muted:false,failed:{},
  init:function(){
    if(this.el)return;
    try{
      var a=new Audio();a.loop=true;a.preload='auto';a.volume=0;
      this.el=a;
      var self=this;
      a.addEventListener('error',function(){if(self.key)self.failed[self.key]=true;self.silence();Aud.ambient(true);});
    }catch(e){this.el=null;}
  },
  setVol:function(v){this.vol=clamp(v,0,1);this._apply();},
  _apply:function(){if(!this.el)return;try{this.el.volume=clamp(this.muted?0:this.vol*this.cur,0,1);}catch(e){}},
  play:function(key){
    this.init();if(!this.el)return;
    if(!key||!MUSIC_FILES[key]||this.failed[key]){this.silence();Aud.ambient(true);return;}
    if(this.key===key){
      this.target=1;
      if(this.el.paused){try{var p0=this.el.play();if(p0&&p0['catch'])p0['catch'](function(){});}catch(e){}}
      this._apply();return;
    }
    this.key=key;this.target=1;
    try{
      this.el.src=MUSIC_FILES[key];
      this.el.load();
      var p=this.el.play();if(p&&p['catch'])p['catch'](function(){});
    }catch(e){}
  },
  silence:function(){
    this.key=null;this.target=0;this.cur=0;
    if(this.el){try{this.el.pause();}catch(e){}}
    this._apply();
  },
  pause:function(){if(this.el){try{this.el.pause();}catch(e){}}},
  resume:function(){
    if(this.el&&this.key&&this.target>0&&!this.muted){
      try{var p=this.el.play();if(p&&p['catch'])p['catch'](function(){});}catch(e){}
    }
  },
  mute:function(m){this.muted=m;this._apply();},
  tick:function(dt){
    var d=this.target-this.cur;
    if(Math.abs(d)>0.002){this.cur+=d*Math.min(1,dt*2.4);this._apply();}
    else if(this.cur!==this.target){this.cur=this.target;this._apply();}
  }
};
function startSeasonAudio(forceAmbient){
  if(!Mus.unlocked)return;

  else{Mus.silence();Aud.ambient(true);}
}

var Poki={
  ok:false,playing:false,inAd:false,lastAd:0,AD_GAP:45000,
  init:function(cb){
    var self=this;
    try{
      if(window.PokiSDK&&typeof window.PokiSDK.init==='function'){
        var p=window.PokiSDK.init();
        if(p&&typeof p.then==='function'){p.then(function(){self.ok=true;if(cb)cb();},function(){self.ok=false;if(cb)cb();});return;}
      }
    }catch(e){}
    self.ok=false;if(cb)cb();
  },
  loaded:function(){try{if(this.ok)window.PokiSDK.gameLoadingFinished();}catch(e){}},
  /* يُستدعى مرة واحدة فقط عند أول تفاعل فعلي (زر اللعب) */
  start:function(){
    if(this.playing||this.inAd)return;
    try{if(this.ok&&window.PokiSDK.gameplayStart){window.PokiSDK.gameplayStart();this.playing=true;}}catch(e){}
  },
  stop:function(){
    if(!this.playing||this.inAd)return;
    try{if(this.ok&&window.PokiSDK.gameplayStop){window.PokiSDK.gameplayStop();this.playing=false;}}catch(e){}
  },
  _guard:function(){
    /* منع الإعلانات المتتالية */
    if(this.inAd)return false;
    var now=Date.now();
    if(now-this.lastAd<this.AD_GAP)return false;
    this.lastAd=now;return true;
  },
  commercial:function(cb){
    if(!this._guard()){if(cb)cb();return;}
    var self=this;this.inAd=true;Aud.mute(true);Mus.mute(true);Mus.pause();
    var at=$('adTxt');if(at)at.textContent=t('adLoading');
    var ao=$('adOver');if(ao)ao.style.display='flex';
    var done=false,fin=function(){if(done)return;done=true;self.inAd=false;if(ao)ao.style.display='none';if(cb)cb();};
    try{
      if(this.ok&&window.PokiSDK.commercialBreak){
        var p=window.PokiSDK.commercialBreak();
        if(p&&typeof p.then==='function'){p.then(fin,fin);return;}
      }
    }catch(e){}
    setTimeout(fin,120);
  },
  rewarded:function(cb){
    if(this.inAd){if(cb)cb(false);return;}
    this.lastAd=Date.now();
    var self=this;this.inAd=true;Aud.mute(true);Mus.mute(true);Mus.pause();
    var at=$('adTxt');if(at)at.textContent=t('adLoading');
    var ao=$('adOver');if(ao)ao.style.display='flex';
    var done=false,fin=function(ok){if(done)return;done=true;self.inAd=false;if(ao)ao.style.display='none';if(cb)cb(ok);};
    try{
      if(this.ok&&window.PokiSDK.rewardedBreak){
        var p=window.PokiSDK.rewardedBreak(function(){});
        if(p&&typeof p.then==='function'){p.then(function(s){fin(!!s);},function(){fin(false);});return;}
      }
    }catch(e){}
    setTimeout(function(){fin(true);},150);
  }
};

var Aud={
  ctx:null,master:null,muted:false,vol:0.8,amb:null,nb:null,

    try{

      var len=Math.floor(this.ctx.sampleRate*1.5),b=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=b.getChannelData(0);
      for(var i=0;i<len;i++)d[i]=Math.random()*2-1;

  },
  resume:function(){try{if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();}catch(e){}},
  setVol:function(v){this.vol=v;if(this.master&&!this.muted)this.master.gain.value=v;},
  mute:function(m){this.muted=m;if(this.master)this.master.gain.value=m?0:this.vol;Mus.mute(m);},
  tone:function(f,f2,dur,type,g0){

      if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),c.currentTime+dur);
      g.gain.setValueAtTime(0.0001,c.currentTime);
      g.gain.linearRampToValueAtTime(g0||0.2,c.currentTime+0.012);
      g.gain.exponentialRampToValueAtTime(0.0008,c.currentTime+dur);
      o.connect(g);g.connect(this.master);o.start();o.stop(c.currentTime+dur+0.05);
    }catch(e){}
  },
  noise:function(dur,freq,q,g0){
    if(!this.ctx||this.muted||!this.nb)return;
    try{
      var c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
      s.buffer=this.nb;s.loop=true;f.type='bandpass';f.frequency.value=freq||900;f.Q.value=q||1;

      s.connect(f);f.connect(g);g.connect(this.master);s.start();s.stop(c.currentTime+dur+0.05);
    }catch(e){}
  },
  step:function(run){this.noise(run?0.1:0.07,run?520:380,1.1,run?0.12:0.07);},

  door:function(){this.tone(200,110,0.4,'sawtooth',0.05);this.noise(0.28,240,3,0.04);},
  pick:function(){this.tone(880,0,0.09,'triangle',0.13);var s=this;setTimeout(function(){s.tone(1320,0,0.14,'triangle',0.11);},70);},

function cv(w,h){var c=document.createElement('canvas');c.width=w;c.height=h||w;return c;}
function speckle(g,w,h,n,al,cols){
  var img=g.getImageData(0,0,w,h),d=img.data,i,idx,a,x,y,cn=cols.length,ci,px,py,ox,oy;
  var cr=new Uint8Array(cn),cg=new Uint8Array(cn),cb=new Uint8Array(cn);
  for(i=0;i<cn;i++){ci=parseInt(cols[i].substr(1),16);cr[i]=(ci>>16)&255;cg[i]=(ci>>8)&255;cb[i]=ci&255;}
  for(i=0;i<n;i++){
    x=(Math.random()*w)|0;y=(Math.random()*h)|0;ci=(Math.random()*cn)|0;a=al*Math.random();
    for(oy=0;oy<2;oy++)for(ox=0;ox<2;ox++){
      px=x+ox;py=y+oy;if(px>=w||py>=h)continue;
      idx=(py*w+px)*4;
      d[idx]=d[idx]*(1-a)+cr[ci]*a;d[idx+1]=d[idx+1]*(1-a)+cg[ci]*a;d[idx+2]=d[idx+2]*(1-a)+cb[ci]*a;
    }
  }
  g.putImageData(img,0,0);
}

var CHUNK=48,OFFX=120,BUILD={};

Builder.prototype.box=function(cx,cy,cz,sx,sy,sz,uv,ry){

    var ux=sx/uv,uy=sy/uv,uz=sz/uv;

    this.q(x1,y0,z0,x0,y0,z0,x0,y1,z0,x1,y1,z0,0,0,-1,ux,uy);
    this.q(x1,y0,z1,x1,y0,z0,x1,y1,z0,x1,y1,z1,1,0,0,uz,uy);
    this.q(x0,y0,z0,x0,y0,z1,x0,y1,z1,x0,y1,z0,-1,0,0,uz,uy);
    this.q(x0,y1,z1,x1,y1,z1,x1,y1,z0,x0,y1,z0,0,1,0,ux,uz);
    this.q(x0,y0,z0,x1,y0,z0,x1,y0,z1,x0,y0,z1,0,-1,0,ux,uz);
    return;
  }
  var cs=Math.cos(ry),sn=Math.sin(ry),V=[],i,P2,xx,yy,zz;
  P2=[[-hx,-hy,-hz],[hx,-hy,-hz],[hx,hy,-hz],[-hx,hy,-hz],[-hx,-hy,hz],[hx,-hy,hz],[hx,hy,hz],[-hx,hy,hz]];

  for(i=0;i<6;i++){
    var fc=f[i],n=fc[4];

};
Builder.prototype.planeY=function(cx,cy,cz,sx,sz,uv,up){

Builder.prototype.build=function(material){

function B(cat,x){

var NOCAST={ceil:1,floorTile:1,floorWood:1,wcTile:1,grass:1,asphalt:1,glow:1,glowWarm:1,glowGreen:1,glowSoft:1,glowSky:1,glass:1};

/* ================= 8. COLLISION + PHYSICS ================= */
var COL=[],GRID={},CELL=4,STAMP=0,QRY=[];
var WORLD_MINX=-104.2,WORLD_MAXX=104.2,WORLD_MINZ=-104.2,WORLD_MAXZ=84.2;
var PHYS={gravity:24,jump:8.9,maxFall:42,groundAccel:62,airAccel:16,friction:11,crouchFriction:17,step:0.45,fallSafe:12,fallDeadly:28};
function addCol(x0,y0,z0,x1,y1,z1,opt){
  opt=opt||{};
  var b={x0:x0,y0:y0,z0:z0,x1:x1,y1:y1,z1:z1,cx:(x0+x1)/2,cz:(z0+z1)/2,hw:(x1-x0)/2,hd:(z1-z0)/2,
    sight:opt.sight!==false,nav:opt.nav!==false,desk:!!opt.desk,door:!!opt.door,off:false,st:0};
  COL.push(b);
  var cx0=Math.floor(x0/CELL),cx1=Math.floor(x1/CELL),cz0=Math.floor(z0/CELL),cz1=Math.floor(z1/CELL),cx,cz,k,a;
  for(cx=cx0;cx<=cx1;cx++)for(cz=cz0;cz<=cz1;cz++){k=cx+'_'+cz;a=GRID[k];if(!a){a=[];GRID[k]=a;}a.push(b);}
  return b;
}
function qcol(x,z){
  QRY.length=0;STAMP++;
  var cx=Math.floor(x/CELL),cz=Math.floor(z/CELL),i,j,a,k;
  for(i=-1;i<=1;i++)for(j=-1;j<=1;j++){
    a=GRID[(cx+i)+'_'+(cz+j)];if(!a)continue;
    for(k=0;k<a.length;k++){var b=a[k];if(b.st===STAMP||b.off)continue;b.st=STAMP;QRY.push(b);}
  }
  return QRY;
}
function groundAt(x,z,r,ylo,yhi,ignoreDesks){
  var list=qcol(x,z),g=-1e9,i,b;
  for(i=0;i<list.length;i++){
    b=list[i];
    if(ignoreDesks&&b.desk)continue;
    if(b.y1<=ylo+0.002||b.y0>=yhi)continue;
    if(Math.abs(x-b.cx)>=b.hw+r)continue;
    if(Math.abs(z-b.cz)>=b.hd+r)continue;
    if(b.y1>g)g=b.y1;
  }
  return g;
}
function headFree(e,r,yb,yt){
  var list=qcol(e.x,e.z),i,b;
  for(i=0;i<list.length;i++){
    b=list[i];
    if(e.ignoreDesks&&b.desk)continue;
    if(b.y1<=yb||b.y0>=yt)continue;
    if(Math.abs(e.x-b.cx)<b.hw+r&&Math.abs(e.z-b.cz)<b.hd+r)return false;
  }
  return true;
}
function resolveAxis(e,axis,r,yb,yt){
  var list=qcol(e.x,e.z),push=0,i,b,ox,oz,dx,dz,p;
  for(i=0;i<list.length;i++){
    b=list[i];
    if(e.ignoreDesks&&b.desk)continue;
    if(b.y1<=yb+0.0005||b.y0>=yt-0.0005)continue;
    dx=e.x-b.cx;dz=e.z-b.cz;
    ox=(r+b.hw)-Math.abs(dx);if(ox<=0)continue;
    oz=(r+b.hd)-Math.abs(dz);if(oz<=0)continue;
    if(axis==='x'){p=dx<0?-ox:ox;if(Math.abs(p)>Math.abs(push))push=p;}
    else{p=dz<0?-oz:oz;if(Math.abs(p)>Math.abs(push))push=p;}
  }
  if(push!==0){
    if(axis==='x')e.x+=push;else e.z+=push;
    if(e.onBlocked)e.onBlocked(axis);
    return true;
  }
  return false;
}
function resolveY(e,r,yb,yt){
  var list=qcol(e.x,e.z),push=0,i,b,oy,cy,hh,bcy,bhh,p;
  cy=(yb+yt)*0.5;hh=(yt-yb)*0.5;
  for(i=0;i<list.length;i++){
    b=list[i];
    if(e.ignoreDesks&&b.desk)continue;
    if(Math.abs(e.x-b.cx)>=b.hw+r)continue;
    if(Math.abs(e.z-b.cz)>=b.hd+r)continue;
    bcy=(b.y0+b.y1)*0.5;bhh=(b.y1-b.y0)*0.5;
    oy=(hh+bhh)-Math.abs(cy-bcy);
    if(oy<=0)continue;
    p=(cy<bcy)?-oy:oy;
    if(Math.abs(p)>Math.abs(push))push=p;
  }
  return push;
}
function depenetrate(e,r,yb,yt){
  for(var it=0;it<3;it++){
    var list=qcol(e.x,e.z),best=0,bx=0,bz=0,i,b,ox,oz,dx,dz,pen;
    for(i=0;i<list.length;i++){
      b=list[i];
      if(e.ignoreDesks&&b.desk)continue;
      if(b.y1<=yb+0.0005||b.y0>=yt-0.0005)continue;
      dx=e.x-b.cx;dz=e.z-b.cz;
      ox=(r+b.hw)-Math.abs(dx);if(ox<=0)continue;
      oz=(r+b.hd)-Math.abs(dz);if(oz<=0)continue;
      pen=Math.min(ox,oz);
      if(pen>best){best=pen;if(ox<oz){bx=dx<0?-ox:ox;bz=0;}else{bx=0;bz=dz<0?-oz:oz;}}
    }
    if(best===0)break;
    e.x+=bx;e.z+=bz;
  }
}
function moveVertical(e,dy,r,hb,ht){
  e.y+=dy;
  var push=resolveY(e,r,e.y+hb,e.y+ht);
  if(push>0){e.y+=push;e.vy=0;e.grounded=true;e.coyote=0.12;}
  else{
    if(push<0){e.y+=push;e.vy=0;}
    if(dy<=0){
      var gy=groundAt(e.x,e.z,r*0.92,e.y-0.62,e.y+hb+0.12,e.ignoreDesks);
      if(gy<e.baseY)gy=e.baseY;
      if(e.y<=gy+0.02){e.y=gy;e.vy=0;e.grounded=true;e.coyote=0.12;}
      else e.grounded=false;
    }else e.grounded=false;
  }
  if(e.y<e.baseY-25){e.y=e.baseY;e.vy=0;e.grounded=true;}
  if(e.y>90){e.y=90;e.vy=0;}
}
function moveXZ(e,dx,dz,r,hb,ht,stepH){
  var nx=e.x,nz=e.z;
  e.x+=dx;var hx=resolveAxis(e,'x',r,e.y+hb,e.y+ht);
  e.z+=dz;var hz=resolveAxis(e,'z',r,e.y+hb,e.y+ht);
  if(hx||hz){
    e.x=nx;e.z=nz;
    var gy=groundAt(e.x,e.z,r*0.92,e.y-0.55,e.y+stepH+0.03,e.ignoreDesks);
    if(gy<e.baseY)gy=e.baseY;
    var up=gy-e.y;
    if(up>0.02&&up<=stepH&&headFree(e,r,gy+hb,gy+ht)){
      var oy=e.y;e.y=gy;
      e.x+=dx;var ax=resolveAxis(e,'x',r,e.y+hb,e.y+ht);
      e.z+=dz;var az=resolveAxis(e,'z',r,e.y+hb,e.y+ht);
      if((ax&&Math.abs(dx)>0.0005)||(az&&Math.abs(dz)>0.0005)){
        e.y=oy;e.x=nx;e.z=nz;
        e.x+=dx;resolveAxis(e,'x',r,oy+hb,oy+ht);
        e.z+=dz;resolveAxis(e,'z',r,oy+hb,oy+ht);
      }
    }else{
      e.x=nx+dx;resolveAxis(e,'x',r,e.y+hb,e.y+ht);
      e.z=nz+dz;resolveAxis(e,'z',r,e.y+hb,e.y+ht);
    }
  }
  depenetrate(e,r,e.y+hb,e.y+ht);
  if(e.x<WORLD_MINX+r)e.x=WORLD_MINX+r;if(e.x>WORLD_MAXX-r)e.x=WORLD_MAXX-r;

    x0=b.x0-pad;x1=b.x1+pad;z0=b.z0-pad;z1=b.z1+pad;
    c0x=Math.max(0,Math.floor((x0-NAV.x0)*inv));c1x=Math.min(W-1,Math.floor((x1-NAV.x0)*inv));
    c0z=Math.max(0,Math.floor((z0-NAV.z0)*inv));c1z=Math.min(H-1,Math.floor((z1-NAV.z0)*inv));

  PERF.frames++;

function updateSwarm(dt,time){

function updateParticles(dt){

  else if(s==='heart'){col=0xff5a9a;sz=0.26;}

function updateSheep(dt){
  var i;
  for(i=0;i<WORLD.sheep.length;i++){
    var s=WORLD.sheep[i];
    if(!s.grp.visible)continue;
    if(s.rider){
      s.bob+=dt*9;
      s.grp.position.set(s.x,s.y+Math.abs(Math.sin(s.bob))*0.05,s.z);
      s.grp.rotation.y=s.ry;continue;
    }
    s.timer-=dt;
    if(s.timer<=0){
      s.timer=rnd(2.2,6);
      if(Math.random()<0.65){
        var bd=sheepBounds(s),p=null;
        for(var k=0;k<12;k++){
          var nx=s.x+rnd(-18,18),nz=s.z+rnd(-18,18);
          if(nx>bd.x0&&nx<bd.x1&&nz>bd.z0&&nz<bd.z1&&!pointBlocked(nx,nz,0.5,false)){p=[nx,nz];break;}
        }
        if(p){s.tx=p[0];s.tz=p[1];s.state='walk';}else s.state='idle';
      }else s.state='idle';
    }
    var wx=0,wz=0;
    if(s.state==='walk'){
      var dx=s.tx-s.x,dz=s.tz-s.z,dl=Math.sqrt(dx*dx+dz*dz);
      if(dl<0.6){s.state='idle';s.timer=0.4;}
      else{s.ry=turnTo(s.ry,Math.atan2(-dz,dx),3*dt);wx=dx/dl*1.45;wz=dz/dl*1.45;}
    }
    s.vx=lerp(s.vx,wx,1-Math.pow(0.002,dt));
    s.vz=lerp(s.vz,wz,1-Math.pow(0.002,dt));
    moveXZ(s,s.vx*dt,s.vz*dt,0.46,0.05,1.3,0.3);
    s.vy-=PHYS.gravity*dt;if(s.vy<-PHYS.maxFall)s.vy=-PHYS.maxFall;
    moveVertical(s,s.vy*dt,0.46,0.05,1.3);
    s.bob+=dt*(s.state==='walk'?9:2.2);
    s.grp.position.set(s.x,s.y+Math.abs(Math.sin(s.bob))*(s.state==='walk'?0.05:0.018),s.z);
    s.grp.rotation.y=s.ry;
    s.bleat-=dt;
    if(s.bleat<=0){s.bleat=rnd(7,22);if(Math.hypot(s.x-P.x,s.z-P.z)<26)Aud.bleat();}
  }
  for(i=0;i<WORLD.sheep.length;i++){
    var sh=WORLD.sheep[i];
    if(!sh.grp.visible||sh.rider)continue;
    var dd=Math.hypot(sh.x-P.x,sh.z-P.z);
    if(dd<1.2&&Math.abs(sh.y-P.y)<1.4){
      var nnx=(P.x-sh.x)/(dd||1),nnz=(P.z-sh.z)/(dd||1),pu=(1.2-dd)*0.5;
      sh.x-=nnx*pu;sh.z-=nnz*pu;P.x+=nnx*pu;P.z+=nnz*pu;
    }
  }
}
function turnTo(cur,target,maxStep){var diff=((target-cur+Math.PI*3)%TAU)-Math.PI;return cur+clamp(diff,-maxStep,maxStep);}

function spawnEnemies(){

function refreshEnemies(){
  if(!WORLD.enemies.length)return;
  var n=Math.min(DIFF[S.diff].n+SEASONS[S.season].addEnemies,4),k=0,i,e;
  for(i=0;i<WORLD.enemies.length;i++){
    e=WORLD.enemies[i];
    if(e.kind==='rabbit')e.active=!!SEASONS[S.season].rabbit;
    else{e.active=(k<n);k++;}
    e.grp.visible=e.active;
    if(e.active){e.state='patrol';e.path=null;e.lostT=0;e.vy=0;e.vx=0;e.vz=0;}

function enemyOpenDoor(e){
  var fx=e.x+Math.sin(e.ry)*1.2,fz=e.z+Math.cos(e.ry)*1.2;
  for(var i=0;i<WORLD.doors.length;i++){
    var d=WORLD.doors[i];if(d.open)continue;
    var c=doorCenter(d);
    if(Math.hypot(c[0]-fx,c[1]-fz)<1.7||Math.hypot(c[0]-e.x,c[1]-e.z)<1.6){d.open=true;d.target=1.9;Aud.door();return;}
  }
}
function updateEnemies(dt){
  var d=DIFF[S.diff],pl=P,i,e;
  for(i=0;i<WORLD.enemies.length;i++){
    e=WORLD.enemies[i];
    if(!e.active)continue;
    var dx=pl.x-e.x,dz=pl.z-e.z,dist=Math.sqrt(dx*dx+dz*dz);
    var sightR=(e.kind==='rabbit')?d.sight+6:d.sight;
    var canSee=false;
    if(!pl.hidden&&!pl.dead&&dist<sightR&&Math.abs(pl.y-e.y)<2.2){
      if(S.track==='perm')canSee=true;
      else if(!losBlocked(e.x,e.z,pl.x,pl.z))canSee=true;
      else if(S.track==='classic'&&dist<5.5)canSee=true;
    }
    if(S.track==='perm'&&!pl.dead)canSee=true;
    if(canSee){
      if(e.state!=='chase'){e.state='chase';if(e.kind==='rabbit')Aud.squeak();else Aud.tone(320,420,0.22,'triangle',0.05);}
      e.lostT=0;e.pathT=0;e.tx=pl.x;e.tz=pl.z;e.path=null;
    }else if(e.state==='chase'){
      e.lostT+=dt;if(e.lostT>2.6){e.state=(S.track==='perm')?'chase':'hunt';e.path=null;}
    }else if(e.state==='hunt'){e.lostT+=dt;if(e.lostT>7){e.state='patrol';e.path=null;}}
    e.pathT-=dt;
    if(!e.path||e.pi>=e.path.length||e.pathT<=0){
      e.pathT=(e.state==='chase')?0.55:1.4;
      var gx,gz;
      if(e.state==='chase'){gx=e.tx;gz=e.tz;}
      else{
        var c=navCell(e.x,e.z),p=randomNavPoint(c[0],c[1],e.state==='patrol'?24:15);
        if(p){gx=p[0];gz=p[1];e.tx=gx;e.tz=gz;}else{gx=e.x;gz=e.z;}
      }
      e.path=findPath(e.x,e.z,gx,gz);e.pi=0;
    }
    var mvx=0,mvz=0;
    if(e.state==='chase'&&dist<10&&!losBlocked(e.x,e.z,pl.x,pl.z)){mvx=dx/(dist||1);mvz=dz/(dist||1);}
    else if(e.path&&e.pi<e.path.length){
      var wp=e.path[e.pi],wx=wp[0]-e.x,wz=wp[1]-e.z,wl=Math.sqrt(wx*wx+wz*wz);
      if(wl<0.85)e.pi++;else{mvx=wx/wl;mvz=wz/wl;}
    }else{
      var ex=e.tx-e.x,ez=e.tz-e.z,el=Math.sqrt(ex*ex+ez*ez)||1;
      if(el>1.2){mvx=ex/el;mvz=ez/el;}
    }
    var base=(e.kind==='rabbit')?d.sp*1.06:d.sp;
    var tgt=(e.state==='chase')?base:(e.state==='hunt'?base*0.8:base*0.52);
    e.speed=lerp(e.speed,tgt,1-Math.pow(0.02,dt));
    var rad=(e.kind==='rabbit')?0.34:0.42;
    var hb=0.05,ht=(e.kind==='rabbit')?1.0:1.9;
    var sm=1-Math.pow(e.grounded?0.0008:0.02,dt);
    e.vx=lerp(e.vx,mvx*e.speed,sm);
    e.vz=lerp(e.vz,mvz*e.speed,sm);
    if(mvx||mvz)e.ry=turnTo(e.ry,Math.atan2(mvx,mvz),7*dt);
    moveXZ(e,e.vx*dt,e.vz*dt,rad,hb,ht,0.6);
    if(mvx||mvz)e.walk+=dt*e.speed*2.4;
    if(e.blockedT>0){e.blockedT-=dt;if(e.blockedT<=0)enemyOpenDoor(e);}
    e.vy-=PHYS.gravity*dt;if(e.vy<-PHYS.maxFall)e.vy=-PHYS.maxFall;
    moveVertical(e,e.vy*dt,rad,hb,ht);
    e.anim+=dt;
    var hop=(e.kind==='rabbit')?Math.abs(Math.sin(e.walk*1.3))*0.17:Math.abs(Math.sin(e.walk))*0.03;
    e.grp.position.set(e.x,e.y+hop,e.z);
    e.grp.rotation.y=e.ry;
    if(e.a1){
      var sw=Math.sin(e.walk)*(e.state==='chase'?0.6:0.3);
      e.a1.rotation.x=sw;e.a2.rotation.x=-sw;
      e.lan.position.y=0.86+Math.sin(e.walk)*0.05;
    }
    if(e.head)e.head.rotation.y=(canSee&&dist<18)?clamp(Math.atan2(dx,dz)-e.ry,-0.8,0.8):clamp(Math.sin(e.anim*0.7)*0.35,-0.5,0.5);
    e.light.intensity=(e.state==='chase')?1.8:1.1;
    e.light.color.setHex(SEASONS[S.season].enemyLight);
    e.atkT-=dt;
    /* الإمساك = خصم لياقة بسيط وإبعاد، بدون عنف */
    if(!pl.dead&&dist<((e.kind==='rabbit')?1.15:1.35)&&!pl.hidden&&Math.abs(pl.y-e.y)<1.6&&e.atkT<=0){
      e.atkT=1.6;tagPlayer(d.dmg*(e.kind==='rabbit'?0.5:1),e);
    }
    for(var j=0;j<WORLD.enemies.length;j++){
      if(j===i)continue;
      var o=WORLD.enemies[j];if(!o.active)continue;
      separate(e,o,rad,(o.kind==='rabbit')?0.34:0.42);
    }
    if(!pl.dead&&!pl.hidden&&Math.abs(pl.y-e.y)<1.5)separate(e,pl,rad,0.34);
    depenetrate(e,rad,e.y+hb,e.y+ht);
  }
}

var P={x:-80,z:0,y:0,vx:0,vz:0,vy:0,baseY:0,grounded:true,coyote:0,jumpBuf:0,jumpHold:0,landDip:0,roll:0,

function eyeY(){if(P.mounted)return 1.58;if(P.hidden)return 0.44;return lerp(1.62,0.98,P.crouchT);}
function tagPlayer(dmg,from){
  if(P.inv>0||P.shield>0||P.dead)return;
  P.hp-=dmg;P.inv=1.5;
  Aud.caught();notifyCaught();addShake(0.09);
  if(from){
    var dx=P.x-from.x,dz=P.z-from.z,l=Math.sqrt(dx*dx+dz*dz)||1;
    P.vx+=dx/l*3.4;P.vz+=dz/l*3.4;
    if(P.grounded){P.vy=2.6;P.grounded=false;}
  }
  if(P.hp<=0){P.hp=0;die();}
}
function notifyCaught(){var el=$('dmg');if(el)el.style.opacity='0.6';dmgT=0.4;}
function nearestDesk(x,z,rad){
  var list=qcol(x,z),best=null,bd=1e9;
  for(var i=0;i<list.length;i++){
    var b=list[i];if(!b.desk||b.y1<0.6)continue;
    var d=Math.hypot(b.cx-x,b.cz-z);
    if(d<bd&&d<rad){bd=d;best={x:b.cx,z:b.cz,b:b};}
  }
  return best;
}
function toggleHide(){
  if(P.mounted){dismount();return;}
  if(P.hidden){
    P.hidden=false;P.hideDesk=null;P.ignoreDesks=false;
    depenetrate(P,0.34,P.y+0.05,P.y+1.0);
    toast(t('unhid'));return;
  }
  var d=nearestDesk(P.x,P.z,2.0);
  if(!d){
    if(!P.crouch){P.crouch=true;toast('⬇️');}
    else toast(t('noDesk'));
    return;
  }
  P.hidden=true;P.hideDesk=d;P.crouch=true;P.ignoreDesks=true;
  P.x=d.x;P.z=d.z;P.vx=0;P.vz=0;P.vy=0;
  Aud.noise(0.18,300,1,0.04);
  toast(t('hid'));
}
function dismount(){
  var s=P.mounted;if(!s)return;
  s.rider=null;P.mounted=null;
  var nx=s.x+Math.cos(s.ry+Math.PI/2)*1.2,nz=s.z-Math.sin(s.ry+Math.PI/2)*1.2;
  if(!pointBlocked(nx,nz,0.34,true)){P.x=nx;P.z=nz;}else{P.x=s.x;P.z=s.z+1.3;}
  P.y=s.y;P.vy=0;P.vx=0;P.vz=0;
  depenetrate(P,0.34,P.y+0.05,P.y+1.7);
  Aud.bleat();
}
function tryJump(){
  if(P.dead||P.hidden||P.mounted)return;
  P.jumpBuf=0.14;
}
function accelTowards(wx,wz,maxD){
  var dx=wx-P.vx,dz=wz-P.vz,d=Math.sqrt(dx*dx+dz*dz);
  if(d>0.0001){var f=Math.min(maxD,d)/d;P.vx+=dx*f;P.vz+=dz*f;}
}
function updatePlayer(dt){
  if(P.dead)return;
  P.inv=Math.max(0,P.inv-dt);
  P.shield=Math.max(0,P.shield-dt);
  P.jumpBuf=Math.max(0,P.jumpBuf-dt);
  P.coyote=Math.max(0,P.coyote-dt);
  var ls=1-Math.pow(0.0006,dt);
  P.yaw=lerp(P.yaw,P.yawT,ls);
  P.pitch=lerp(P.pitch,P.pitchT,ls);
  var mvx=0,mvz=0,f=0,r=0;
  if(!P.hidden){
    f=IN.fwd;r=IN.right;
    mvx=-Math.sin(P.yaw)*f+Math.cos(P.yaw)*r;
    mvz=-Math.cos(P.yaw)*f-Math.sin(P.yaw)*r;
    var l=Math.sqrt(mvx*mvx+mvz*mvz);
    if(l>1){mvx/=l;mvz/=l;}
  }
  var wantCrouch=(P.crouch||P.hidden)&&!P.mounted?1:0;
  if(wantCrouch===0&&!headFree(P,0.34,P.y+1.06,P.y+1.76))wantCrouch=1;
  P.crouchT=lerp(P.crouchT,wantCrouch,1-Math.pow(0.0006,dt));
  var moving=(Math.abs(mvx)+Math.abs(mvz))>0.05;
  var wantRun=IN.run&&P.st>2&&P.crouchT<0.4&&!P.hidden&&!P.mounted&&P.grounded;
  var speed=P.mounted?6.4:(P.crouchT>0.5?1.75:(wantRun?5.75:3.35));
  if(!P.grounded&&!P.mounted)speed*=0.96;
  if(wantRun){P.st=Math.max(0,P.st-21*dt);P.sprintT=1;}
  else{P.sprintT=Math.max(0,P.sprintT-dt);if(P.sprintT<=0)P.st=Math.min(100,P.st+(P.grounded?13:6)*dt);}
  var hb=P.hidden?0.0:0.06, ht=P.hidden?0.55:lerp(1.72,1.0,P.crouchT);
  if(P.mounted){
    P.vx=mvx*speed;P.vz=mvz*speed;
    moveXZ(P,P.vx*dt,P.vz*dt,0.34,hb,ht,PHYS.step);
    P.mounted.x=P.x;P.mounted.z=P.z;P.mounted.y=P.y;
    P.mounted.ry=P.yaw+Math.PI/2;P.mounted.state='walk';P.mounted.timer=1.2;
    P.vy=0;P.grounded=true;
  }else{
    var wx=mvx*speed,wz=mvz*speed;
    if(P.grounded){
      var sp=Math.sqrt(P.vx*P.vx+P.vz*P.vz);
      if(sp>0.0001){
        var fr=(P.crouchT>0.5?PHYS.crouchFriction:PHYS.friction);
        var kk=Math.max(0,sp-sp*fr*dt)/sp;
        P.vx*=kk;P.vz*=kk;
      }
      accelTowards(wx,wz,PHYS.groundAccel*dt);
    }else accelTowards(wx,wz,PHYS.airAccel*dt);
    if(P.jumpBuf>0&&(P.grounded||P.coyote>0)&&!P.hidden){
      P.vy=PHYS.jump*(P.crouchT>0.5?0.82:1);
      P.grounded=false;P.coyote=0;P.jumpBuf=0;P.jumpHold=0.24;
      Aud.jump();
    }
    var g=PHYS.gravity;
    if(IN.jump&&P.vy>0&&P.jumpHold>0){g*=0.55;P.jumpHold-=dt;}else P.jumpHold=0;
    if(!P.grounded&&P.vy<0)g*=1.18;
    moveXZ(P,P.vx*dt,P.vz*dt,0.34,hb,ht,PHYS.step);
    P.vy-=g*dt;
    if(P.vy<-PHYS.maxFall)P.vy=-PHYS.maxFall;
    var prevVy=P.vy,wasAir=!P.grounded;
    moveVertical(P,P.vy*dt,0.34,hb,ht);
    if(wasAir&&P.grounded){
      var impact=Math.abs(prevVy);
      if(impact>2.5){Aud.land(clamp(impact/26,0,1));addShake(clamp(impact*0.004,0,0.06));}
      P.landDip=Math.min(0.26,impact*0.02);
      if(impact>PHYS.fallSafe){
        var dmg=(impact-PHYS.fallSafe)*5;
        if(impact>=PHYS.fallDeadly)dmg=100;
        if(dmg>0){P.inv=0;P.shield=0;tagPlayer(dmg,null);if(!P.dead)toast(t('fallDmg'));}
      }
    }
  }
  P.landDip=lerp(P.landDip,0,1-Math.pow(0.0009,dt));
  if(moving&&P.grounded&&!P.hidden){
    var cadence=wantRun?13:(P.crouchT>0.5?6:9);
    P.bob+=dt*cadence*(0.6+Math.min(1,Math.sqrt(P.vx*P.vx+P.vz*P.vz)/5.5)*0.6);
    P.stepT-=dt*(wantRun?1.7:1);
    if(P.stepT<=0){P.stepT=0.42;Aud.step(wantRun);}
  }else P.bob=lerp(P.bob,0,dt*6);
  if(P.light){
    P.bat-=dt*1.1;
    if(P.bat<=0){P.bat=0;P.light=false;toast('🔦');}
  }
  var lat=P.vx*Math.cos(P.yaw)-P.vz*Math.sin(P.yaw);
  var rollT=clamp(-lat*0.006,-0.04,0.04)+(P.grounded?0:0.01*Math.sin(gameTime*2));
  P.roll=lerp(P.roll,rollT,1-Math.pow(0.002,dt));
  var bobY=(P.grounded?Math.sin(P.bob)*0.032:0)+Math.sin(P.bob*0.5)*0.005;
  var bobX=Math.cos(P.bob*0.5)*0.028;
  var spd=Math.sqrt(P.vx*P.vx+P.vz*P.vz);
  var q=QUAL[S.qual]||QUAL.medium;
  var fovKick=clamp((spd-3.4)*1.2,0,5)+(P.grounded?0:1.2);
  camera.fov=lerp(camera.fov,q.fov+fovKick,1-Math.pow(0.004,dt));
  camera.updateProjectionMatrix();
  camera.position.set(P.x+bobX*Math.cos(P.yaw),P.y+eyeY()+bobY-P.landDip,P.z-bobX*Math.sin(P.yaw));
  camera.rotation.set(P.pitch,P.yaw,P.roll+Math.sin(P.bob*0.5)*0.006);
  if(SHAKE.amp>0.0005){
    SHAKE.amp*=Math.pow(0.0008,dt);
    camera.position.x+=(Math.random()-0.5)*SHAKE.amp;
    camera.position.y+=(Math.random()-0.5)*SHAKE.amp;
    camera.rotation.z+=(Math.random()-0.5)*SHAKE.amp*0.6;
  }else SHAKE.amp=0;
  var fi=P.light?(0.9+0.15*(P.bat/100)):0;
  flash.intensity=lerp(flash.intensity,fi*3.4,1-Math.pow(0.001,dt));
  var nd=nearestEnemyDist();
  var near=clamp(1-(nd-2)/16,0,1);
  var fe=$('fear');if(fe)fe.style.opacity=(near*0.5).toFixed(2);
  if(nd<10&&!P.hidden){P.heartT-=dt;if(P.heartT<=0){P.heartT=0.4+nd*0.06;Aud.heart(near);}}
  if(P.hp<100&&P.hp>0&&P.shield<=0)P.hp=Math.min(100,P.hp+dt*0.8);
}
function nearestEnemyDist(){
  var m=1e9;
  for(var i=0;i<WORLD.enemies.length;i++){var e=WORLD.enemies[i];if(!e.active)continue;m=Math.min(m,Math.hypot(e.x-P.x,e.z-P.z));}
  return m;
}
function nearestSheepDist(){
  var m=1e9;
  for(var i=0;i<WORLD.sheep.length;i++){var s=WORLD.sheep[i];if(!s.grp.visible)continue;m=Math.min(m,Math.hypot(s.x-P.x,s.z-P.z));}
  return m;
}

var stickActive=false,stickId=null,stickCx=0,stickCy=0,STICK_R=54;
function placeStickHome(){
  var st=$('stick'),kn=$('stickN');
  if(!st||!kn)return;
  var isRTL=(document.documentElement.dir==='rtl');
  st.style.display='block';
  st.style.left=(isRTL?(st.parentElement.clientWidth-st.offsetWidth-22):22)+'px';
  st.style.top=(st.parentElement.clientHeight-st.offsetHeight-22)+'px';
  var rc=st.getBoundingClientRect();
  stickCx=rc.left+rc.width/2;stickCy=rc.top+rc.height/2;
  kn.style.transform='translate(0px,0px)';
}
function setupStick(){
  var st=$('stick'),kn=$('stickN'),zone=$('touch');
  if(!st||!kn||!zone)return;
  function place(x,y){
    var pr=st.parentElement.getBoundingClientRect();
    st.style.display='block';
    st.style.left=Math.round(x-pr.left-st.offsetWidth/2)+'px';
    st.style.top=Math.round(y-pr.top-st.offsetHeight/2)+'px';
    stickCx=x;stickCy=y;
    kn.style.transform='translate(0px,0px)';
  }
  function mv(x,y){
    var dx=x-stickCx,dy=y-stickCy,m=Math.hypot(dx,dy);
    if(m>STICK_R){dx=dx/m*STICK_R;dy=dy/m*STICK_R;}
    kn.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';
    var nx=dx/STICK_R,ny=dy/STICK_R;
    if(Math.abs(nx)<DEADZONE)nx=0;
    if(Math.abs(ny)<DEADZONE)ny=0;
    IN.fwd=-ny;IN.right=nx;
  }
  zone.addEventListener('touchstart',function(ev){
    for(var i=0;i<ev.changedTouches.length;i++){
      var tt=ev.changedTouches[i];
      var el=document.elementFromPoint(tt.clientX,tt.clientY);
      if(el&&el.classList&&el.classList.contains('tbtn'))continue;
      if(el&&el.id==='tP')continue;
      if(stickActive)continue;
      var pr=zone.getBoundingClientRect();
      var isLeft=(document.documentElement.dir==='rtl')?(tt.clientX>pr.left+pr.width*0.45):(tt.clientX<pr.left+pr.width*0.55);
      if(isLeft||el===st||el===kn||el===$('stickRing')){
        stickActive=true;stickId=tt.identifier;
        place(tt.clientX,tt.clientY);
        if(!started)firstInput();
        ev.preventDefault();
      }
    }
  },{passive:false});
  zone.addEventListener('touchmove',function(ev){
    if(!stickActive)return;
    for(var i=0;i<ev.changedTouches.length;i++){
      if(ev.changedTouches[i].identifier===stickId){mv(ev.changedTouches[i].clientX,ev.changedTouches[i].clientY);ev.preventDefault();break;}
    }
  },{passive:false});
  var end=function(ev){
    if(!ev.changedTouches)return;
    for(var i=0;i<ev.changedTouches.length;i++){
      if(ev.changedTouches[i].identifier===stickId){
        stickActive=false;stickId=null;IN.fwd=0;IN.right=0;
        kn.style.transform='translate(0px,0px)';
        st.style.display='none';
        ev.preventDefault();
      }
    }
  };
  zone.addEventListener('touchend',end,{passive:false});
  zone.addEventListener('touchcancel',end,{passive:false});
  if(IS_TOUCH)placeStickHome();
}
function readKeys(){
  if(IS_TOUCH&&stickActive)return;

  if(k['d']||k['arrowright']||k['ي'])r+=1;
  if(k['a']||k['arrowleft']||k['ش'])r-=1;
  IN.fwd=f;IN.right=r;
  IN.run=!!k['shift'];

var curTarget=null;
function findTarget(){
  var best=null,bd=1e9,i,d;
  for(i=0;i<WORLD.doors.length;i++){
    var dr=WORLD.doors[i],c=doorCenter(dr);
    d=Math.hypot(c[0]-P.x,c[1]-P.z);
    if(d<2.6&&d<bd){bd=d;best={type:'door',obj:dr,label:dr.open?t('p_close'):t('p_open')};}
  }
  for(i=0;i<WORLD.faucets.length;i++){
    var f=WORLD.faucets[i];if(f.taken)continue;
    d=Math.hypot(f.x-P.x,f.z-P.z);
    if(d<2.4&&d<bd){bd=d;best={type:'faucet',obj:f,label:t('p_take')};}
  }
  for(i=0;i<WORLD.cells.length;i++){
    var cc=WORLD.cells[i];if(cc.taken)continue;
    d=Math.hypot(cc.x-P.x,cc.z-P.z);
    if(d<2.0&&d<bd){bd=d;best={type:'cell',obj:cc,label:t('p_cell')};}
  }
  for(i=0;i<WORLD.meds.length;i++){
    var m=WORLD.meds[i];if(m.taken)continue;
    d=Math.hypot(m.x-P.x,m.z-P.z);
    if(d<2.0&&d<bd){bd=d;best={type:'med',obj:m,label:t('p_med')};}
  }
  if(P.mounted){best={type:'dismount',obj:P.mounted,label:t('p_dismount')};bd=0.1;}
  else for(i=0;i<WORLD.sheep.length;i++){
    var s=WORLD.sheep[i];if(!s.grp.visible)continue;
    d=Math.hypot(s.x-P.x,s.z-P.z);
    if(d<2.5&&Math.abs(s.y-P.y)<1.2&&d<bd){bd=d;best={type:'sheep',obj:s,label:t('p_ride')};}
  }
  if(WORLD.gate){
    d=Math.hypot(WORLD.gate.x-P.x,WORLD.gate.z-P.z);
    if(d<5.5&&(!best||bd>1.5)){best={type:'gate',obj:WORLD.gate,label:WORLD.gate.locked?t('p_gateLocked'):t('p_gate')};bd=d;}
  }
  curTarget=best;
  return curTarget;
}
function doInteract(){
  if(state!=='playing'||P.dead)return;
  var tg=findTarget();
  if(!tg)return;
  if(tg.type==='door'){tg.obj.open=!tg.obj.open;tg.obj.target=tg.obj.open?1.9:0;Aud.door();}
  else if(tg.type==='faucet'){
    var f=tg.obj;f.taken=true;scene.remove(f.grp);P.fau++;
    Aud.faucet();toast(t('got_faucet',P.fau));
    if(P.fau>=6&&WORLD.gate&&WORLD.gate.locked){
      WORLD.gate.locked=false;
      WORLD.gate.leaf.material=MATS.gateOpen;
      WORLD.gate.col.off=true;WORLD.gate.col.sight=false;
      Aud.unlock();
      setTimeout(function(){toast(t('got_all'),3000);},1500);
    }
  }
  else if(tg.type==='cell'){var c=tg.obj;c.taken=true;scene.remove(c.grp);P.cells++;Aud.pick();toast(t('got_cell'));}
  else if(tg.type==='med'){var m=tg.obj;m.taken=true;scene.remove(m.grp);P.hp=Math.min(100,P.hp+35);Aud.pick();toast(t('got_med'));}
  else if(tg.type==='sheep'){
    var s=tg.obj;P.mounted=s;s.rider=P;P.hidden=false;P.ignoreDesks=false;P.crouch=false;P.vy=0;
    Aud.bleat();toast(t('riding'));
  }
  else if(tg.type==='dismount')dismount();
  else if(tg.type==='gate'){
    if(WORLD.gate.locked){Aud.noise(0.25,300,2,0.09);toast('🔒 '+t('p_gateLocked')+' ('+P.fau+'/6)');}
    else{Aud.unlock();winGame();}
  }
}

  if(P.mounted){ico='🐑';stx=t('riding');}
  if(P.shield>0){ico='🛡️';stx=Math.ceil(P.shield)+'s';}
  $('stateIco').textContent=ico;$('stateTxt').textContent=stx;
  var pr=$('prompt');
  if(curTarget&&!P.dead){
    pr.style.display='block';
    pr.innerHTML='<span class="key">'+(IS_TOUCH?'ⓔ':'E')+'</span>'+curTarget.label;
  }else pr.style.display='none';
  if(P.hintT>0){
    P.hintT-=dt;$('objHint').style.display='block';
    var nf=nearestFaucet(),tx,tz;
    if(nf){tx=nf.x;tz=nf.z;}else if(WORLD.gate){tx=WORLD.gate.x;tz=WORLD.gate.z;}
    if(tx!==undefined){
      var adx=tx-P.x,adz=tz-P.z;
      var rel=Math.atan2(adx*Math.cos(P.yaw)-adz*Math.sin(P.yaw),-adx*Math.sin(P.yaw)-adz*Math.cos(P.yaw));
      $('compass').style.display='block';
      $('compass').firstChild.style.transform='rotate('+(rel*180/Math.PI)+'deg)';
    }
    if(P.hintT<=0){$('objHint').style.display='none';$('compass').style.display='none';}
  }
  if(dmgT>0){dmgT-=dt;$('dmg').style.opacity=Math.max(0,dmgT/0.4*0.6).toFixed(2);}
}
function nearestFaucet(){
  var b=null,bd=1e9;
  for(var i=0;i<WORLD.faucets.length;i++){var f=WORLD.faucets[i];if(f.taken)continue;
    var d=Math.hypot(f.x-P.x,f.z-P.z);if(d<bd){bd=d;b=f;}}
  return b;
}
function pickupChecks(dt){
  var i;
  for(i=0;i<WORLD.coins.length;i++){
    var c=WORLD.coins[i];if(c.taken)continue;
    c.grp.rotation.y+=dt*2.4;c.grp.position.y=0.35+Math.sin(gameTime*2+i)*0.07;
    if(Math.hypot(c.grp.position.x-P.x,c.grp.position.z-P.z)<c.r&&Math.abs(P.y)<1.2){
      c.taken=true;scene.remove(c.grp);P.coins++;Aud.tone(1200,1600,0.07,'triangle',0.05);
    }
  }
  for(i=0;i<WORLD.faucets.length;i++){var f=WORLD.faucets[i];if(!f.taken){f.grp.rotation.y+=dt*1.1;f.halo.scale.setScalar(0.3*(1+Math.sin(gameTime*3)*0.1));}}
  for(i=0;i<WORLD.cells.length;i++){var cc=WORLD.cells[i];if(!cc.taken){cc.grp.rotation.y+=dt*2;cc.grp.position.y=0.9+Math.sin(gameTime*2.4+i)*0.08;}}
  for(i=0;i<WORLD.meds.length;i++){var m=WORLD.meds[i];if(!m.taken)m.grp.rotation.y+=dt*1.3;}
  if(WORLD.gate&&!WORLD.gate.locked&&P.z<-106&&!P.dead)winGame();
}
function updateDynLights(){
  var n=dynLights.length,cand=[],i;
  for(i=0;i<lightPts.length;i++){
    var lp=lightPts[i],d=Math.hypot(lp[0]-P.x,lp[2]-P.z);
    if(d<46)cand.push({d:d,p:lp});
  }
  cand.sort(function(a,b){return a.d-b.d;});
  var q=QUAL[S.qual]||QUAL.medium;
  var lim=Math.min(n,q.dyn,cand.length);
  var dark=(S.amb==='night'||S.amb==='dusk'||S.season==='nightmare'||S.season==='ramadan');
  for(i=0;i<n;i++){
    var L=dynLights[i];
    if(i<lim){
      L.visible=true;
      L.position.set(cand[i].p[0],cand[i].p[1],cand[i].p[2]);
      var flick=dark?(0.92+Math.sin(gameTime*8+i*3)*0.04):1;
      L.intensity=(dark?2.8:1.8)*flick*(cand[i].p[3]?1.1:1);
    }else L.visible=false;
  }
  if(sunLight){
    sunLight.position.set(P.x+60,90,P.z+40);
    sunLight.target.position.set(P.x,0,P.z);
    sunLight.target.updateMatrixWorld();
  }
}
function fmtTime(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return (m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;}

function resetRun(){
  var i;
  resetPlayer();gameTime=0;
  for(i=0;i<WORLD.faucets.length;i++){var f=WORLD.faucets[i];if(f.taken){f.taken=false;scene.add(f.grp);}}
  for(i=0;i<WORLD.coins.length;i++){var c=WORLD.coins[i];if(c.taken){c.taken=false;scene.add(c.grp);}}
  for(i=0;i<WORLD.cells.length;i++){var cc=WORLD.cells[i];if(cc.taken){cc.taken=false;scene.add(cc.grp);}}
  for(i=0;i<WORLD.meds.length;i++){var m=WORLD.meds[i];if(m.taken){m.taken=false;scene.add(m.grp);}}
  for(i=0;i<WORLD.doors.length;i++){
    var d=WORLD.doors[i];
    d.open=false;d.target=0;d.ang=0;d.av=0;d.grp.rotation.y=d.ry0;d.col.off=false;d.col.sight=true;
  }
  if(WORLD.gate){
    WORLD.gate.locked=true;WORLD.gate.leaf.material=MATS.gateLock;
    WORLD.gate.col.off=false;WORLD.gate.col.sight=true;
  }
  var spots=[[-70,0],[60,0],[10,0],[-20,0],[75,0]];
  for(i=0;i<WORLD.enemies.length;i++){
    var e=WORLD.enemies[i];
    e.state='patrol';e.path=null;e.speed=0;e.atkT=0;e.lostT=0;e.vy=0;e.vx=0;e.vz=0;e.y=0;
    if(e.kind==='rabbit'){e.x=-40;e.z=rnd(-4,4);}
    else{var sp=spots[i%spots.length];e.x=sp[0];e.z=sp[1];}
    e.grp.position.set(e.x,0,e.z);
  }
  refreshEnemies();refreshAllCostumes();
  for(i=0;i<WORLD.sheep.length;i++){
    var s=WORLD.sheep[i];s.rider=null;
    var bd=sheepBounds(s);
    s.x=rnd(bd.x0+6,bd.x1-6);s.z=rnd(bd.z0+6,bd.z1-6);s.y=0;s.vy=0;s.vx=0;s.vz=0;
    s.grp.position.set(s.x,0,s.z);s.state='idle';s.timer=rnd(0,3);

function pauseGame(){

/* استئناف: بدون إعلان (الإعلان يظهر في نقاط طبيعية فقط) */
function resumeGame(reward){
  if(state!=='paused')return;
  $('pause').classList.add('hidden');
  var go=function(){
    Aud.mute(false);Aud.resume();Mus.mute(false);
    state='playing';document.body.style.cursor=IS_TOUCH?'default':'none';
    startSeasonAudio();
    requestLock();Poki.start();
  };
  if(reward){
    state='adwait';
    Poki.rewarded(function(ok){
      if(ok){
        P.hp=Math.min(100,P.hp+60);P.shield=8;P.inv=Math.max(P.inv,1);P.hintT=26;
        $('objHint').textContent=t('hintWin');
        toast(t('rewardOk'),2400);

      go();
    });
  }else{
    state='playing';document.body.style.cursor=IS_TOUCH?'default':'none';
    Aud.mute(false);Aud.resume();Mus.mute(false);
    startSeasonAudio();
    requestLock();Poki.start();
  }
}

function makeMenuArt(){
  try{
    var c=cv(960,540),g=c.getContext('2d'),i;
    var gr=g.createLinearGradient(0,0,0,540);
    gr.addColorStop(0,'#16233a');gr.addColorStop(.5,'#1b2c44');gr.addColorStop(1,'#0a1120');
    g.fillStyle=gr;g.fillRect(0,0,960,540);
    var vx=480,vy=278;
    g.strokeStyle='rgba(110,160,220,.16)';g.lineWidth=2;
    for(i=0;i<11;i++){var tt=i/11,w=660*(1-tt*0.86),h=380*(1-tt*0.86);g.strokeRect(vx-w/2,vy-h/2+28*tt,w,h);}
    for(var s=-1;s<=1;s+=2)for(var k=1;k<7;k++){
      var zz=1-k/7;
      var x1=vx+s*(470*zz),y1=vy-190*zz+28,x2=vx+s*(470*(zz-0.12)),y2=vy-190*(zz-0.12)+28;
      g.fillStyle='rgba(26,40,64,.92)';
      g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x2,y2+220*(zz-0.12));g.lineTo(x1,y1+220*zz);g.closePath();g.fill();
    }
    for(i=0;i<5;i++){
      var t2=(i+1)/6,lx=vx,ly=vy-186*(1-t2)+28;
      var rg=g.createRadialGradient(lx,ly,0,lx,ly,116*(1-t2)+32);
      rg.addColorStop(0,'rgba(255,238,200,'+(0.4*(1-t2)+0.12)+')');rg.addColorStop(1,'rgba(255,222,168,0)');
      g.fillStyle=rg;g.beginPath();g.arc(lx,ly,116*(1-t2)+32,0,TAU);g.fill();
    }
    g.fillStyle='rgba(240,236,226,.4)';
    for(i=0;i<4;i++){var sx=130+i*195,sy=470-((i%2)*14);
      g.beginPath();g.ellipse(sx,sy,30,19,0,0,TAU);g.fill();
      g.beginPath();g.arc(sx+28,sy-7,10,0,TAU);g.fill();}
    g.font='46px serif';g.textAlign='center';
    g.fillText('🐑',480,330);
    $('menu').style.backgroundImage='url('+c.toDataURL('image/jpeg',0.7)+')';
  }catch(e){fail('menuArt',e);}
}

/* ================= 23. BUILD QUEUE ================= */
var WORLD_READY=false,BT=[],btIdx=0,buildDone=false,ENGINE_OK=false;
function pushBuild(name,fn){BT.push({name:name,fn:fn});}
function updateBuildStat(){
  var el=$('buildStat');if(!el)return;
  if(!ENGINE_OK){el.textContent=t('preparing');el.style.color='#ffd479';return;}
  if(WORLD_READY){el.textContent=t('ready');el.style.color='#7fe0a8';}
  else{
    var pc=BT.length?Math.round(btIdx/BT.length*100):0;
    el.textContent=t('building',pc);el.style.color='#ffd479';
  }
}
function runBuildChunk(){
  var t0=NOW();
  while(btIdx<BT.length){
    var task=BT[btIdx++];
    try{task.fn();}catch(err){fail('build:'+task.name,err);}
    if(NOW()-t0>12)break;
  }
  updateBuildStat();
  if(btIdx>=BT.length&&!buildDone){buildDone=true;onBuildDone();}
}
function finishBuildSync(){
  while(btIdx<BT.length){
    var task=BT[btIdx++];
    try{task.fn();}catch(err){fail('build:'+task.name,err);}
  }
  if(!buildDone){buildDone=true;onBuildDone();}
  updateBuildStat();
}
function onBuildDone(){
  WORLD_READY=true;
  try{applySeason();resize();}catch(e){fail('onBuildDone',e);}
  if(camera){camera.position.set(-70,1.7,0);camera.rotation.set(0,Math.PI/2,0);}
  P.yaw=P.yawT=-Math.PI/2;
  updateBuildStat();
  Poki.loaded();
  if(Mus.unlocked&&state==='menu')startSeasonAudio();
  setTimeout(function(){var e=$('buildStat');if(e&&WORLD_READY&&state==='menu')e.textContent='';},3000);
}
function queueInit(){
  pushBuild('engine',function(){
    THREE=window.THREE;
    initThree();
    initTmp();
    ENGINE_OK=true;
    updateBuildStat();
  });
  pushBuild('textures',function(){buildTextures();});
  pushBuild('materials',function(){buildMaterials();applyQuality();});
  pushBuild('shell',taskShell);
  pushBuild('roomsA',function(){taskRooms(0,9);});
  pushBuild('roomsB',function(){taskRooms(9,18);});
  pushBuild('roomsC',function(){taskRooms(18,26);});
  pushBuild('ground',function(){buildGround();buildGate();flushBuilds();});
  pushBuild('props',function(){buildProps();});
  pushBuild('sky',function(){buildSky();buildDust();buildParticles();makeSkyTexture();});
  pushBuild('swarm',function(){buildSwarm();});
  pushBuild('items',function(){placeItems();});
  pushBuild('sheep',function(){spawnSheep(14);});
  pushBuild('nav',function(){navInit();buildAreas();});
  pushBuild('enemies',function(){spawnEnemies();applySeason();});
}

/* ================= 24. LOOP ================= */
function loop(){
  requestAnimationFrame(loop);
  try{
    if(!ENGINE_OK)return;
    if(!buildDone){runBuildChunk();return;}
    var dt=Math.min(0.05,clock.getDelta());
    if(!(dt>0))dt=0.016;
    var time=clock.elapsedTime;
    Mus.tick(dt);
    perfGovernor(NOW());
    if(SKY.mesh)SKY.mesh.position.copy(camera.position);
    if(state==='playing'){
      readKeys();pollCrouchToggle();
      gameTime+=dt;
      updatePlayer(dt);
      updateEnemies(dt);
      updateSheep(dt);
      updateDoors(dt);
      updateSwarm(dt,time);
      findTarget();
      pickupChecks(dt);
      updateDynLights();
      updateParticles(dt);
      updateDust(dt);
      updateHUD(dt);
    }else if(state==='menu'||state==='end'){
      camera.rotation.y+=dt*0.03;
      updateDynLights();
      updateParticles(dt);
      updateDust(dt);
      updateSwarm(dt,time);
    }else return;
    renderFrame();
  }catch(e){fail('loop',e);}
}
function setProgress(p,txt){
  var b=$('loadBar');if(b)b.style.width=Math.round(p*100)+'%';
  var l=$('loadTxt');if(l)l.textContent=Math.round(p*100)+'%'+(txt?(' — '+txt):'');
}

    s.src=alts[idx++];
    s.onload=function(){
      if(window.THREE){if(window.__GAME__&&window.__GAME__.boot){try{window.__GAME__.boot();}catch(e){showFatal();}}}
      else go();
    };
    s.onerror=go;
    document.head.appendChild(s);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);
  else go();
  setTimeout(function(){
    var l=document.getElementById('loading');
    if(l&&!l.classList.contains('hidden')&&!window.THREE)showFatal();
  },9000);
})();
</script>
</body>
</html>
